<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>(VAMRSS) WSV Minimal Text / v0.8.0</title>
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --invert-bg: #111714;
      --invert-ink: #f8f9f9;
      --danger: #9b3144;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #101312;
      --ink: #edf1ef;
      --sub: #a4aeaa;
      --muted: #707b77;
      --invert-bg: #edf1ef;
      --invert-ink: #101312;
      --danger: #e28a9a;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.01em;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: calc(max(18px, env(safe-area-inset-top)) + 24px) 20px max(36px, env(safe-area-inset-bottom));
    }


    .fixed-version-mark {
      position: fixed;
      right: 20px;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 20;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      line-height: 1;
      pointer-events: none;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      grid-template-areas: "logo nav";
      align-items: start;
      column-gap: 18px;
      row-gap: 0;
      margin-bottom: 48px;
    }

    .site-title {
      grid-area: logo;
      margin: 0;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.11em;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      text-align: left;
    }


    .site-title {
      grid-area: logo;
      justify-self: start;
      align-self: start;
      text-align: left;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      width: 100%;
      padding: 0;
      margin: 0;
      line-height: 1;
    }

    .site-logo {
      appearance: none;
      border: 0;
      background: transparent;
      display: block;
      width: 145px;
      max-width: 38vw;
      margin: 0;
      padding: 0;
      line-height: 0;
      text-align: left;
      flex: 0 0 auto;
      transform: translateX(0);
      cursor: pointer;
    }

    .site-logo-img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 32px;
      margin: 0;
      padding: 0;
      object-fit: contain;
      object-position: left center;
    }

    .site-logo:focus {
      outline: none;
    }

    html[data-theme="dark"] .site-logo-img {
      filter: invert(1);
    }

    .screen-label {
      color: var(--sub);
      letter-spacing: 0.08em;
    }

    .version-mark {
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    .text-nav {
      grid-area: nav;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      justify-content: flex-end;
      flex-wrap: nowrap;
      text-align: right;
      align-self: start;
      justify-self: end;
      padding: 0;
      margin: 0;
      line-height: 1;
      white-space: nowrap;
    }

    .text-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0 2px;
      color: var(--sub);
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
    }


    .inline-search-wrap.open {
      display: block;
    }

    .inline-search-wrap #searchInput {
      width: 100%;
      min-width: 0;
      min-height: 24px;
      border: 0;
      border-radius: 0;
      background: var(--ink);
      color: var(--bg);
      padding: 2px 8px;
      outline: none;
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
      text-align: left;
    }

    .inline-search-wrap #searchInput::placeholder {
      color: var(--bg);
      opacity: 0.88;
    }

    .theme-symbol {
      font-family: var(--font-main);
      font-size: 12px;
      line-height: 2;
      letter-spacing: 0;
      text-transform: none;
    }

    .topbar .text-nav .text-button {
      line-height: 1;
      padding-top: 0;
    }

    .text-button:hover,
    .text-button.active {
      color: var(--ink);
    }

    .text-button.selected {
      color: var(--ink);
    }

    .text-button.selected::before {
      content: "[";
    }

    .text-button.selected::after {
      content: "]";
    }

    #techniqueLinks .text-button.selected {
      color: var(--invert-ink);
      background: var(--invert-bg);
    }

    #techniqueLinks .text-button.selected::before,
    #techniqueLinks .text-button.selected::after {
      content: "";
    }

    .text-button.danger {
      color: var(--danger);
    }

    .text-button.danger:hover {
      color: var(--invert-ink);
      background: var(--danger);
    }


    .mode-switch .text-button::before,
    .bracket-switch .text-button::before {
      content: "[";
      color: var(--bg);
    }

    .mode-switch .text-button::after,
    .bracket-switch .text-button::after {
      content: "]";
      color: var(--bg);
    }

    .mode-switch .text-button.selected::before,
    .mode-switch .text-button.selected::after,
    .bracket-switch .text-button.selected::before,
    .bracket-switch .text-button.selected::after {
      content: "";
    }

    .mode-switch .text-button .mode-bracket {
      color: var(--bg);
    }

    .mode-switch .text-button.selected,
    .bracket-switch .text-button.selected {
      color: var(--ink);
    }

    .mode-switch .text-button.selected::before,
    .bracket-switch .text-button.selected::before {
      content: "[";
      color: var(--ink);
    }

    .mode-switch .text-button.selected::after,
    .bracket-switch .text-button.selected::after {
      content: "]";
      color: var(--ink);
    }

    #entryScreen .form input,
    #entryScreen .form textarea,
    #entryScreen .form select,
    #seriesEntryScreen .form input,
    #seriesEntryScreen .form textarea,
    #seriesEntryScreen .form select {
      border: 0;
      background: var(--ink);
      color: var(--bg);
      padding: 2px 8px;
    }

    #entryScreen .form input::placeholder,
    #entryScreen .form textarea::placeholder,
    #seriesEntryScreen .form input::placeholder,
    #seriesEntryScreen .form textarea::placeholder {
      color: var(--bg);
      opacity: 0.65;
    }

    #entryScreen .ask-line,
    #seriesEntryScreen .ask-line {
      color: var(--sub);
    }

    #entryScreen .ask-line input {
      background: transparent;
      padding: 0;
    }

    #entryScreen .form select,
    #seriesEntryScreen .form select {
      color-scheme: dark;
    }

    html[data-theme="dark"] #entryScreen .form select,
    html[data-theme="dark"] #seriesEntryScreen .form select {
      color-scheme: light;
    }

    .filter-area {
      display: grid;
      gap: 8px;
      margin-bottom: 11px;
    }

    .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0 5px;
      min-width: 0;
    }

    .mode-switch,
    .bracket-switch {

    }

    .collapsible {
      display: none;

    }

    .collapsible.open {
      display: grid;
      gap: 7px;
      margin-bottom: 24px;
    }

    .search-line {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      margin-bottom: 14px;
    }

    .utility-line {
      grid-template-columns: auto minmax(0, 1fr) auto;
    }

      grid-column: 1;
      justify-self: start;
    }

    .utility-line button:last-child {
      grid-column: 3;
      justify-self: end;
    }

    .inline-search-wrap {
      display: none;
      grid-column: 2;
      min-width: 0;
    }

    .inline-search-wrap.open {
      display: block;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      min-height: 24px;
      border: 0;
      border-radius: 0;
      background: var(--ink);
      color: var(--bg);
      padding: 2px 8px;

      font-size: 12px;

      line-height: 2;
      text-align: left;
    }

    #searchInput::placeholder {
      color: var(--bg);
      opacity: 0.88;
    }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      min-height: 24px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 2px 0;
      outline: none;
      font-size: 12px;
      font-weight: 300;
      line-height: 2;
    }

    .search-line input {
      border-bottom: 0;
    }

    .search-line input:focus {
      border-bottom: 0;
    }

    .form input,
    .form textarea,
    .form select,
    .data-block input,
    .data-block textarea,
    .data-block select {
      border-bottom: 1px solid var(--sub);

    .form input:focus,
    .form textarea:focus,
    .form select:focus,
    .data-block input:focus,
    .data-block textarea:focus,
    .data-block select:focus {
      border-bottom-color: var(--ink);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    textarea {
      min-height: 72px;
      resize: vertical;
    }

    select {
      appearance: none;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .list {
      display: grid;
      gap: 0;
    }

    .list-head,
    .work-summary {
      width: 100%;
      display: grid;
      grid-template-columns: 4.5em minmax(0, 1fr) 7.5em;
      gap: 1em;
      align-items: baseline;
      border: 0;
      background: transparent;
      padding: 1px 0;
      text-align: left;
    }


    .list-head .text-button.selected::before,
    .list-head .text-button.selected::after {
      content: "";
    }

    .list-head .text-button.selected {
      color: var(--ink);
      background: transparent;
    }

    .list-head button,
    .list-head button:last-child,
    .list-head .text-button:nth-child(1),
    .list-head .text-button:nth-child(2),
    .list-head .text-button:nth-child(3) {
      justify-self: stretch;
      text-align: left;
    }


    .sort-mark {
      display: inline-block;
      width: 1em;
      text-align: left;
      transform-origin: center;
    }

    .sort-mark.desc {
      transform: rotate(180deg);
    }

    .title-end-date {
      color: var(--sub);
      margin-left: 1em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    #techniqueLinks .text-button {
      background: transparent;
    }

    #techniqueLinks .text-button.selected {
      background: transparent !important;
      color: var(--ink);
    }

    #techniqueLinks .text-button::before,
    #techniqueLinks .text-button::after {
      display: inline-block;
      width: 0.55em;
      text-align: center;
    }

    #techniqueLinks .text-button.selected::before {
      content: "[";
      color: var(--ink);
    }

    #techniqueLinks .text-button.selected::after {
      content: "]";
      color: var(--ink);
    }

    #techniqueLinks .text-button:not(.selected)::before {
      content: "[";
      color: var(--bg);
    }

    #techniqueLinks .text-button:not(.selected)::after {
      content: "]";
      color: var(--bg);
    }

    .list-head {
      color: var(--muted);
      margin-bottom: 4px;
    }

    .list-head button {
      text-align: left;
    }

    .list-head button:last-child {
      text-align: left;
    }

    .list-head .text-button {
      display: block;
      width: 100%;
      white-space: nowrap;
      min-width: 0;
      overflow: visible;
    }

    .list-head .text-button:nth-child(1),
    .list-head .text-button:nth-child(2) {
      justify-self: stretch;
      text-align: left;
    }

    .list-head .text-button:nth-child(3) {
      justify-self: stretch;
      text-align: left;
    }

    .work {
      margin: 0;
    }

    .work-no {
      color: var(--sub);
      text-align: left;
      font-variant-numeric: tabular-nums;
    }



    .work-title {
      position: relative;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .work-title .title-scroll {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: top;
      will-change: transform;
    }

    .work-summary.is-overflow .title-scroll {
      max-width: none;
      padding-right: 2em;
      animation: title-marquee var(--title-duration, 9s) linear infinite;
    }

    @keyframes title-marquee {
      0% {
        transform: translateX(0);
      }
      15% {
        transform: translateX(0);
      }
      85% {
        transform: translateX(calc(-1 * var(--title-distance, 0px)));
      }
      100% {
        transform: translateX(calc(-1 * var(--title-distance, 0px)));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .work-summary.is-overflow .title-scroll {
        animation: none;
        max-width: 100%;
        text-overflow: ellipsis;
      }
    }

    }


    .work-year {
      display: block;
      width: 100%;
      color: var(--sub);
      text-align: right;
      font-variant-numeric: tabular-nums;

    }

    .work-detail {
      display: none;

    }

    .inline-expanded {

    }

    .work.open .work-detail {

    }

    .detail-grid {
      display: grid;

    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
    }

    .detail-key {

<body>
  <main class="app">
    <div class="fixed-version-mark">v0.8.0</div>
    <section id="worksScreen" class="screen active">
      <div class="topbar">
        <h1 class="site-title"><button class="site-logo" type="button" onclick="toggleTheme()" aria-label="Toggle light and dark theme"><img class="site-logo-img" src="./assets/wsv-logo.svg" alt="(VAMRSS) WSV"></button></h1>
        <nav class="text-nav">
          <button class="text-button" type="button" id="modeEntryButton" onclick="showModeEntry()">ENTRY</button>
          <button class="text-button" type="button" onclick="showScreen('data')">DATA</button>
        </nav>
      </div>

      <div class="link-list mode-switch" style="margin-bottom: 9px;">
        <button class="text-button selected" type="button" id="worksModeButton" onclick="setListMode('works')">WORKS</button>
        <button class="text-button" type="button" id="seriesModeButton" onclick="setListMode('series')">SERIES</button>
      </div>

      <div class="filter-area" id="worksFilterArea">
        <div class="link-list bracket-switch" id="techniqueLinks"></div>
      </div>

      <div class="search-line utility-line">
        <button class="text-button" type="button" onclick="toggleStatusPanel()" id="statusPanelText">＋</button>
        <div class="inline-search-wrap" id="inlineSearchWrap">
          <input id="searchInput" type="search" placeholder="search">
        </div>
        <button class="text-button" type="button" onclick="clearFilters()">RESET</button>
      </div>

      <div class="collapsible" id="statusPanel">
        <div class="link-list bracket-switch" id="productionLinks"></div>
        <div class="link-list bracket-switch" id="managementLinks"></div>
      </div>

      <div class="list-head">
        <button class="text-button" type="button" onclick="setSort('workNo')">#<span id="sortMarkWorkNo"></span></button>
        <button class="text-button" type="button" onclick="setSort('title')">TITLE<span id="sortMarkTitle"></span></button>
        <button class="text-button" type="button" onclick="setSort('year')">DONE<span id="sortMarkYear"></span></button>
      </div>
      <div id="workList" class="list"></div>
    </section>

    <section id="entryScreen" class="screen">
      <div class="topbar">
        <h1 class="site-title"><button class="site-logo" type="button" onclick="toggleTheme()" aria-label="Toggle light and dark theme"><img class="site-logo-img" src="./assets/wsv-logo.svg" alt="(VAMRSS) WSV"></button></h1>
        <nav class="text-nav">
          <button class="text-button" type="button" onclick="showScreen('works')">BACK</button>
          <button class="text-button" type="button" onclick="showScreen('data')">DATA</button>
        </nav>
      </div>

      <form id="workForm" class="form">
        <div class="form-grid">
          <div class="field">
            <label for="workNo"># / 作品番号</label>
            <input id="workNo" type="text" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="">
          </div>

          <div class="field">
            <label for="year">Start Date / 制作開始日</label>
            <input id="year" type="date" placeholder="">
          </div>

          <div class="field">
            <label for="title">Title / 作品名</label>
            <input id="title" type="text" required placeholder="">
          </div>

          <div class="field">
            <label for="completedDate">Completed / 完成日</label>
            <input id="completedDate" type="date" placeholder="">
          </div>

          <div class="field">
            <label for="series">Series / シリーズ</label>
            <select id="series"></select>
            <div class="inline-add">
              <input id="seriesInlineInput" type="text" placeholder="">
              <button class="text-button" type="button" id="addSeriesInlineButton">ADD</button>
            </div>
          </div>

          <div class="field">
            <label for="productionStatus">Production / 制作状態</label>
            <select id="productionStatus"></select>
          </div>

          <div class="field">
            <label for="managementStatus">Management / 管理状態</label>
            <select id="managementStatus"></select>
          </div>

          <div class="field">
            <label for="technique">Technique / 技法</label>
            <select id="technique"></select>
          </div>

          <div class="field">
            <label for="materials">Materials / 素材</label>
            <input id="materials" type="text" placeholder="">
          </div>

          <div class="field">
            <label>Dimensions / サイズ mm</label>
            <div class="three-grid">
              <input id="sizeW" type="number" inputmode="numeric" min="0" placeholder="">
              <input id="sizeH" type="number" inputmode="numeric" min="0" placeholder="">
              <input id="sizeD" type="number" inputmode="numeric" min="0" placeholder="">
            </div>
          </div>

          <div class="field">
            <label>Ledger / 価格記録</label>
            <div class="two-grid">
              <div class="sub-field">
                <label for="price">Sale Price / 販売価格</label>
                <input id="price" type="number" inputmode="numeric" min="0" placeholder="">
                <label class="ask-line" for="priceAsk"><input id="priceAsk" type="checkbox"> ASK</label>
              </div>
              <div class="sub-field">
                <label for="cost">Cost / 原価</label>
                <input id="cost" type="number" inputmode="numeric" min="0" placeholder="">
              </div>
            </div>
          </div>

          <div class="field">
            <label for="location">Location / 保管場所</label>
            <select id="location"></select>
          </div>

          <div class="field">
            <label for="owner">Owner / 所蔵先</label>
            <input id="owner" type="text" placeholder="">
          </div>

          <div class="field">
            <label for="exhibitionSelect">Exhibition History / 展示履歴</label>
            <select id="exhibitionSelect"></select>
            <div class="inline-add single-action">
              <button class="text-button" type="button" id="addExhibitionToWorkButton">ADD SELECTED</button>
            </div>
            <div id="selectedExhibitionList" class="selected-list"></div>
            <div class="inline-add">
              <input id="exhibitionInlineInput" type="text" placeholder="">
              <button class="text-button" type="button" id="addExhibitionInlineButton">ADD NEW</button>
            </div>
          </div>

          <div class="field">
            <label for="memo">Memo / メモ</label>
            <textarea id="memo" placeholder=""></textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="text-button active" type="submit" id="submitButton">SAVE</button>
          <button class="text-button" type="button" id="cancelButton" style="display:none;">CANCEL</button>
        </div>
      </form>
    </section>

            <input id="seriesCode" type="text" maxlength="4" placeholder="">

          <button class="text-button" type="button" id="seriesCancelButton" style="display:none;">CANCEL</button>
        </div>
      </form>

        <nav class="text-nav">
          <button class="text-button" type="button" onclick="showScreen('works')">BACK</button>
        </nav>
      </div>

      <div class="data-block">
        <div class="section-title">Export</div>
        <p class="hint">現在の作品データをJSONで保存します。</p>
        <button class="text-button active" type="button" id="exportButton">EXPORT</button>
      </div>

      <div class="data-block">
        <div class="section-title">Import</div>
        <p class="hint">JSONを読み込みます。現在のデータは上書きされます。</p>
        <input id="importFile" type="file" accept="application/json,.json">
      </div>

      <div class="data-block">
        <div class="section-title">CSV</div>
        <p class="hint">series.csvを先に、works.csvを後から読み込んでください。同じ4桁番号は更新、無い番号は追加します。</p>
        <div class="button-row">
          <label class="text-button active file-label" for="seriesCsvFile">SERIES CSV</label>

      </div>
    </section>

    function createId() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function nowIso() { return new Date().toISOString(); }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replaceAll("`", "&#096;");
    }

    function cleanOptions(items, fallback = []) {
      const source = [...(Array.isArray(items) ? items : []), ...(Array.isArray(fallback) ? fallback : [])];
      return [...new Set(source.map(item => String(item || "").trim()).filter(Boolean))];
    }


    function normalizeExhibitions(value) {
      if (Array.isArray(value)) return value.map(v => String(v || "").trim()).filter(Boolean);
      return String(value || "")
        .split(/\n|,|、/)
        .map(v => v.trim())
        .filter(Boolean);
    }

    function setCurrentExhibitions(items) {
      currentExhibitions = cleanOptions(items, []);
      renderSelectedExhibitions();
    }

    function renderSelectedExhibitions() {
      const target = document.getElementById("selectedExhibitionList");
      if (!target) return;
      target.innerHTML = currentExhibitions.map(item => `
        <div class="selected-item">
          <div>${escapeHtml(item)}</div>
          <button class="text-button danger" type="button" onclick="removeExhibitionFromWork('${escapeAttr(item)}')">DELETE</button>
        </div>
      `).join("");
    }

    window.removeExhibitionFromWork = function(value) {
      currentExhibitions = currentExhibitions.filter(item => item !== value);
      renderSelectedExhibitions();
    };

    function normalizeSeriesCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
    }


    function getSeriesRecordByNo(seriesNo) {
      const no = normalizeWorkNo(seriesNo);
      return seriesRecords.find(s => normalizeWorkNo(s.seriesNo) === no) || null;
    }

    function getSeriesRecordByTitle(title) {
      return seriesRecords.find(s => String(s.title || "") === String(title || "")) || null;
    }

    function getSeriesRecordForWork(work) {
      if (!work) return null;
      return getSeriesRecordByNo(work.seriesNo) || getSeriesRecordByTitle(work.series) || null;
    }

    function seriesLabel(series) {
      if (!series) return "Single";
      const code = normalizeSeriesCode(series.code || "");
      const title = String(series.title || "").trim();
      if (code && title) return code + " / " + title;
      return code || title || "Untitled Series";
    }

    function normalizeWorkNo(value) {
      const digits = String(value || "").replace(/\D/g, "");
      return digits ? digits.padStart(4, "0").slice(-4) : "";
    }

    function usedNumbers(exclude = {}) {
      const used = new Set();
      works.forEach(w => {
        if (exclude.type === "work" && w.id === exclude.id) return;
        const no = normalizeWorkNo(w.workNo);
        if (no) used.add(no);
      });
      seriesRecords.forEach(s => {
        if (exclude.type === "series" && s.id === exclude.id) return;
        const no = normalizeWorkNo(s.seriesNo);
        if (no) used.add(no);
      });
      return used;
    }

    function usedWorkNos(excludeId = null) {
      return usedNumbers({ type: "work", id: excludeId });
    }

    function generateRandomNumber(exclude = {}) {
      const used = usedNumbers(exclude);
      const available = [];
      for (let i = 0; i <= 9999; i++) {
        const no = String(i).padStart(4, "0");
        if (!used.has(no)) available.push(no);
      }
      if (!available.length) throw new Error("No available number");
      return available[Math.floor(Math.random() * available.length)];
    }

    function generateRandomWorkNo(excludeId = null) {
      return generateRandomNumber({ type: "work", id: excludeId });
    }

    function generateRandomSeriesNo(excludeId = null) {
      return generateRandomNumber({ type: "series", id: excludeId });
    }

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        works = Array.isArray(saved) ? saved : [];
      } catch {
        works = [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    }

    }

    function loadSettings() {
      try { categories = cleanOptions(JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY)), DEFAULT_CATEGORIES); }
      catch { categories = [...DEFAULT_CATEGORIES]; }

      try { techniques = cleanOptions(JSON.parse(localStorage.getItem(TECHNIQUE_STORAGE_KEY)), DEFAULT_TECHNIQUES); }
      catch { techniques = [...DEFAULT_TECHNIQUES]; }

      try { locations = cleanOptions(JSON.parse(localStorage.getItem(LOCATION_STORAGE_KEY)), DEFAULT_LOCATIONS); }
      catch { locations = [...DEFAULT_LOCATIONS]; }

      try { seriesOptions = cleanOptions(JSON.parse(localStorage.getItem(SERIES_STORAGE_KEY)), DEFAULT_SERIES); }
      catch { seriesOptions = [...DEFAULT_SERIES]; }

      try { exhibitionOptions = cleanOptions(JSON.parse(localStorage.getItem(EXHIBITION_STORAGE_KEY)), DEFAULT_EXHIBITIONS); }
      catch { exhibitionOptions = [...DEFAULT_EXHIBITIONS]; }
    }

    function saveSettings() {
      localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categories));
      localStorage.setItem(TECHNIQUE_STORAGE_KEY, JSON.stringify(techniques));
      localStorage.setItem(LOCATION_STORAGE_KEY, JSON.stringify(locations));
      localStorage.setItem(SERIES_STORAGE_KEY, JSON.stringify(seriesOptions));
      localStorage.setItem(EXHIBITION_STORAGE_KEY, JSON.stringify(exhibitionOptions));
    }


    function migrateWorkSeriesNo() {
      let changed = false;
      works = works.map(w => {
        if (normalizeWorkNo(w.seriesNo)) return w;
        const series = getSeriesRecordByTitle(w.series);
        if (!series) return w;
        changed = true;
        return {
          ...w,
          seriesNo: normalizeWorkNo(series.seriesNo),
          series: series.title || w.series
        };
      });
      if (changed) save();
    }

    function seedIfEmpty() {
      categories = cleanOptions(categories, DEFAULT_CATEGORIES);
      techniques = cleanOptions(techniques, DEFAULT_TECHNIQUES);
      locations = cleanOptions(locations, DEFAULT_LOCATIONS);
      seriesOptions = cleanOptions(seriesOptions, DEFAULT_SERIES);
      exhibitionOptions = cleanOptions(exhibitionOptions, DEFAULT_EXHIBITIONS);
      saveSettings();
    }

    function renderSeriesSelect(select, selected = "") {
      if (!select) return;

      const selectedNo = normalizeWorkNo(selected);
      const selectedRecord = getSeriesRecordByNo(selectedNo) || getSeriesRecordByTitle(selected);

      select.innerHTML = "";
      const fragment = document.createDocumentFragment();

      const singleOption = document.createElement("option");
      singleOption.value = "";
      singleOption.textContent = "Single";
      fragment.appendChild(singleOption);

      seriesRecords
        .slice()
        .sort((a, b) => normalizeWorkNo(a.seriesNo).localeCompare(normalizeWorkNo(b.seriesNo), "ja", { numeric: true }))
        .forEach(series => {
          const option = document.createElement("option");
          option.value = normalizeWorkNo(series.seriesNo);
          option.textContent = seriesLabel(series);
          fragment.appendChild(option);
        });

      select.appendChild(fragment);

      if (selectedRecord) {
        select.value = normalizeWorkNo(selectedRecord.seriesNo);
      } else {
        select.value = selectedNo || "";
      }
    }

    function renderCatalogSelect(select, items, selected = "") {
      const options = [...items];
      if (selected && !options.includes(selected)) options.unshift(selected);
      select.innerHTML = options.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
      if (selected) select.value = selected;
    }

    function setupOptions() {
      fields.productionStatus.innerHTML = PRODUCTION_STATUSES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      fields.managementStatus.innerHTML = MANAGEMENT_STATUSES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      renderSeriesSelect(fields.series, fields.series.value);
      renderCatalogSelect(fields.exhibitionSelect, cleanOptions([...exhibitionOptions, ...works.flatMap(w => normalizeExhibitions(w.exhibitionHistory))], DEFAULT_EXHIBITIONS));
      renderCatalogSelect(fields.technique, techniques);
      renderCatalogSelect(fields.location, locations);
      renderOptionLists();
      renderFilters();
    }

    function techniqueCounts() {
      const map = new Map();
      works.forEach(w => {
        const technique = String(w.technique || "OTHER");
        map.set(technique, (map.get(technique) || 0) + 1);
      });
      techniques.forEach(technique => {
        if (!map.has(technique)) map.set(technique, 0);
      });
      return [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "ja"));
    }

    function renderFilters() {
      const techniqueItems = ["ALL", ...techniqueCounts().map(([technique]) => technique)];
      const techniqueLinks = document.getElementById("techniqueLinks");
      if (techniqueLinks) techniqueLinks.innerHTML = techniqueItems.map(item => {
        return `<button class="text-button ${item === activeTechnique ? "selected" : ""}" type="button" onclick="setTechnique('${escapeAttr(item)}')">${escapeHtml(item)}</button>`;

    function addOption(kind) {
      const input = document.getElementById(kind + "OptionInput");
      const value = input.value.trim();
      if (!value) return;

      if (kind === "category" && !categories.includes(value)) categories.push(value);
      if (kind === "technique" && !techniques.includes(value)) techniques.push(value);
      if (kind === "location" && !locations.includes(value)) locations.push(value);
      if (kind === "series" && !seriesOptions.includes(value)) seriesOptions.push(value);
      if (kind === "exhibition" && !exhibitionOptions.includes(value)) exhibitionOptions.push(value);

      input.value = "";
      saveSettings();
      setupOptions();
      resetForm();
      render();
    }

    window.deleteOption = function(kind, value) {
      if (kind === "category") categories = categories.filter(item => item !== value);
      if (kind === "technique") techniques = techniques.filter(item => item !== value);
      if (kind === "location") locations = locations.filter(item => item !== value);
      if (kind === "series") seriesOptions = seriesOptions.filter(item => item !== value);
      if (kind === "exhibition") exhibitionOptions = exhibitionOptions.filter(item => item !== value);
      saveSettings();
      setupOptions();
      resetForm();
      render();
    };

    window.editOption = function(kind, oldValue) {
      const nextValue = prompt("New name", oldValue);
      if (nextValue == null) return;
      const value = nextValue.trim();
      if (!value || value === oldValue) return;

      function renameInList(list) {
        return cleanOptions(list.map(item => item === oldValue ? value : item), []);
      }

      if (kind === "category") {
        categories = renameInList(categories);
        works = works.map(w => w.category === oldValue ? { ...w, category: value, updatedAt: nowIso() } : w);
      }
      if (kind === "series") {
        seriesOptions = renameInList(seriesOptions);
        works = works.map(w => w.series === oldValue ? { ...w, series: value, updatedAt: nowIso() } : w);
      }
      if (kind === "exhibition") {
        exhibitionOptions = renameInList(exhibitionOptions);
        works = works.map(w => {
          const renamed = normalizeExhibitions(w.exhibitionHistory).map(item => item === oldValue ? value : item);
          return renamed.join("\n") === String(w.exhibitionHistory || "") ? w : { ...w, exhibitionHistory: renamed.join("\n"), updatedAt: nowIso() };
        });
        currentExhibitions = currentExhibitions.map(item => item === oldValue ? value : item);
        renderSelectedExhibitions();
      }
      if (kind === "technique") {
        techniques = renameInList(techniques);
        works = works.map(w => w.technique === oldValue ? { ...w, technique: value, updatedAt: nowIso() } : w);
      }
      if (kind === "location") {
        locations = renameInList(locations);
        works = works.map(w => w.location === oldValue ? { ...w, location: value, updatedAt: nowIso() } : w);
      }

      saveSettings();
      save();
      setupOptions();
      resetForm();
      render();
    };

    function normalizeProductionDate(w = {}) {
      const value = String(w.year || w.productionDate || "");
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(w.completedDate || ""))) return String(w.completedDate);
      if (/^\d{4}$/.test(value)) return `${value}-01-01`;
      return value;
    }

    function normalizeStatuses(w = {}) {
      const legacy = LEGACY_STATUS_MAP[w.status] || {};
      return {
        productionStatus: PRODUCTION_STATUSES.includes(w.productionStatus) ? w.productionStatus : legacy.productionStatus || "制作中",
        managementStatus: MANAGEMENT_STATUSES.includes(w.managementStatus) ? w.managementStatus : legacy.managementStatus || "保管中"
      };
    }

    function normalizeDimensions(w = {}) {
      if (w.sizeW || w.sizeH || w.sizeD) {
        return {
          w: String(w.sizeW || ""),
          h: String(w.sizeH || ""),
          d: String(w.sizeD || "")
        };
      }
      const size = String(w.size || "");
      const match = size.match(/W?\s*(\d+)\D+H?\s*(\d+)\D+D?\s*(\d+)/i);
      return {
        w: match ? match[1] : "",
        h: match ? match[2] : "",
        d: match ? match[3] : ""
      };
    }

    function formatDimensions(w = {}) {
      const d = normalizeDimensions(w);
      const parts = [];
      if (d.w) parts.push(`W${d.w}`);
      if (d.h) parts.push(`H${d.h}`);
      if (d.d) parts.push(`D${d.d}`);
      return parts.length ? `${parts.join(" × ")} mm` : "";
    }

    function formatMoney(value) {
      return value === "" || value == null ? "" : yen.format(Number(value) || 0);
    }

    function compareWorks(a, b) {
      let av = "";
      let bv = "";

      if (sortKey === "workNo") {
        av = normalizeWorkNo(a.workNo);
        bv = normalizeWorkNo(b.workNo);
      } else if (sortKey === "title") {
        av = String(a.title || "");
        bv = String(b.title || "");
      } else if (sortKey === "year") {
        av = String(a.completedDate || "");
        bv = String(b.completedDate || "");
      }

      const result = av.localeCompare(bv, "ja", { numeric: true });
      return sortDirection === "asc" ? result : -result;
    }

    function updateTitleMarquee() {
      document.querySelectorAll(".work-summary").forEach(summary => {
        const title = summary.querySelector(".work-title");
        const scroll = summary.querySelector(".title-scroll");
        if (!title || !scroll) return;

        summary.classList.remove("is-overflow");
        scroll.style.removeProperty("--title-distance");
        scroll.style.removeProperty("--title-duration");

        const titleWidth = title.clientWidth;
        const scrollWidth = scroll.scrollWidth;
        const distance = Math.max(0, scrollWidth - titleWidth);

        if (distance > 1) {
          summary.classList.add("is-overflow");
          scroll.style.setProperty("--title-distance", distance + "px");
          scroll.style.setProperty("--title-duration", Math.max(7, Math.min(18, distance / 12 + 6)) + "s");
        }
      });
    }

        if (editingSeriesId) {
          seriesRecords = seriesRecords.map(s => s.id === editingSeriesId ? seriesFormToRecord(s) : s);
        } else {
          seriesRecords.push(seriesFormToRecord());
        }
      } catch (error) {
        if (error.message === "DUPLICATE_SERIES_NO") {
          alert("この番号は作品またはシリーズで既に使用されています。");
          return;
        }
        if (error.message === "INVALID_SERIES_NO") {
          alert("シリーズ番号は0000〜9999の4桁で入力してください。");
          return;
        }
        alert("保存できませんでした。");
        return;

      if (title && !seriesOptions.includes(title)) {
        seriesOptions.push(title);

    function parseCsv(text) {
      const normalized = String(text || "").replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;

      for (let i = 0; i < normalized.length; i++) {
        const char = normalized[i];
        const next = normalized[i + 1];

        if (inQuotes) {
          if (char === '"' && next === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = false;
          } else {
            field += char;
          }
          continue;
        }

        if (char === '"') {
          inQuotes = true;
        } else if (char === ",") {
          row.push(field);
          field = "";
        } else if (char === "\n") {
          row.push(field);
          if (row.some(cell => String(cell).trim() !== "")) rows.push(row);
          row = [];
          field = "";
        } else {
          field += char;
        }
      }

      row.push(field);
      if (row.some(cell => String(cell).trim() !== "")) rows.push(row);

      if (!rows.length) return [];
      const headers = rows[0].map(h => String(h || "").trim());
      return rows.slice(1).map(values => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] == null ? "" : String(values[index]).trim();
        });
        return item;
      });
    }

    function csvBool(value) {
      const v = String(value || "").trim().toLowerCase();
      return v === "true" || v === "1" || v === "yes" || v === "y" || v === "ask";
    }

    function csvDate(value) {
      const v = String(value || "").trim();
      if (!v) return "";
      const slash = v.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      if (slash) return `${slash[1]}-${slash[2].padStart(2, "0")}-${slash[3].padStart(2, "0")}`;
      const hyphen = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (hyphen) return `${hyphen[1]}-${hyphen[2].padStart(2, "0")}-${hyphen[3].padStart(2, "0")}`;
      return v;
    }

    function ensureOption(list, value) {
      const v = String(value || "").trim();
      if (!v) return list;
      return cleanOptions([...list, v]);
    }

    function importSeriesCsvText(text) {
      const rows = parseCsv(text);
      if (!rows.length) {
        alert("series.csvにデータがありません。");
        return;
      }

      const seen = new Set();
      const now = nowIso();
      let added = 0;
      let updated = 0;
      const invalid = [];

      rows.forEach((row, index) => {
        const seriesNo = normalizeWorkNo(row.seriesNo);
        const title = String(row.title || "").trim();
        if (!/^\d{4}$/.test(seriesNo) || !title || seen.has(seriesNo)) {
          invalid.push(index + 2);
          return;
        }
        seen.add(seriesNo);

        const existing = seriesRecords.find(s => normalizeWorkNo(s.seriesNo) === seriesNo);
        const record = {
          ...(existing || {}),
          id: existing?.id || createId(),
          seriesNo,
          code: normalizeSeriesCode(row.code || ""),
          title,
          startDate: csvDate(row.startDate),
          description: String(row.description || "").trim(),
          createdAt: existing?.createdAt || now,
          updatedAt: now
        };

        if (existing) {
          seriesRecords = seriesRecords.map(s => normalizeWorkNo(s.seriesNo) === seriesNo ? record : s);
          updated++;
        } else {
          seriesRecords.push(record);
          added++;
        }

        seriesOptions = ensureOption(seriesOptions, title);
      });

      if (invalid.length) alert(`series.csvに取り込めない行があります: ${invalid.join(", ")}行目`);

      saveSeriesRecords();
      saveSettings();
      setupOptions();
      render();
      alert(`SERIES CSVを取り込みました。\n追加: ${added}\n更新: ${updated}`);
    }

    function importWorksCsvText(text) {
      const rows = parseCsv(text);
      if (!rows.length) {
        alert("works.csvにデータがありません。");
        return;
      }

      const seen = new Set();
      const now = nowIso();
      let added = 0;
      let updated = 0;
      const invalid = [];
      const missingSeries = [];

      rows.forEach((row, index) => {
        const workNo = normalizeWorkNo(row.workNo);
        if (!/^\d{4}$/.test(workNo) || seen.has(workNo)) {
          invalid.push(index + 2);
          return;
        }
        seen.add(workNo);

        const seriesNo = normalizeWorkNo(row.seriesNo);
        const linkedSeries = seriesNo ? getSeriesRecordByNo(seriesNo) : null;
        if (seriesNo && !linkedSeries) missingSeries.push(`${index + 2}行目:${seriesNo}`);

        const existing = works.find(w => normalizeWorkNo(w.workNo) === workNo);
        const priceAsk = csvBool(row.priceAsk);
        const record = {
          ...(existing || {}),
          id: existing?.id || createId(),
          workNo,
          title: String(row.title || "").trim() || "Untitled",
          seriesNo,
          series: linkedSeries?.title || (seriesNo ? "" : "Single"),
          year: csvDate(row.startDate),
          completedDate: csvDate(row.completedDate),
          productionStatus: PRODUCTION_STATUSES.includes(row.productionStatus) ? row.productionStatus : "制作中",
          managementStatus: MANAGEMENT_STATUSES.includes(row.managementStatus) ? row.managementStatus : "保管中",
          technique: String(row.technique || "").trim(),
          materials: String(row.materials || "").trim(),
          sizeW: String(row.sizeW || "").trim(),
          sizeH: String(row.sizeH || "").trim(),
          sizeD: String(row.sizeD || "").trim(),
          price: priceAsk ? "" : String(row.price || "").trim(),
          priceAsk,
          cost: String(row.cost || "").trim(),
          location: String(row.location || "").trim(),
          owner: String(row.owner || "").trim(),
          exhibitionHistory: String(row.exhibitionHistory || "").replace(/\s*\|\s*/g, "\n"),
          memo: String(row.memo || "").trim(),
          createdAt: existing?.createdAt || now,
          updatedAt: now
        };

        if (existing) {
          works = works.map(w => normalizeWorkNo(w.workNo) === workNo ? record : w);
          updated++;
        } else {
          works.push(record);
          added++;
        }

        techniques = ensureOption(techniques, record.technique);
        locations = ensureOption(locations, record.location);
        if (record.series) seriesOptions = ensureOption(seriesOptions, record.series);
        normalizeExhibitions(record.exhibitionHistory).forEach(item => {
          exhibitionOptions = ensureOption(exhibitionOptions, item);
        });
      });

      if (invalid.length) alert(`works.csvに取り込めない行があります: ${invalid.join(", ")}行目`);
      if (missingSeries.length) {
        alert(`未登録のseriesNoがあります。先にSERIES CSVを取り込んでください。\n${missingSeries.slice(0, 20).join("\n")}${missingSeries.length > 20 ? "\n..." : ""}`);
      }

      save();
      saveSettings();
      setupOptions();
      render();
      alert(`WORKS CSVを取り込みました。\n追加: ${added}\n更新: ${updated}`);
    }

    function readCsvFile(file, callback) {

      reader.onerror = () => alert("CSVを読み込めませんでした。");
      reader.readAsText(file, "utf-8");
    }

    document.getElementById("importFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const importedWorks = Array.isArray(data) ? data : data.works;
          const importedSeriesRecords = Array.isArray(data.seriesRecords) ? data.seriesRecords : [];
          if (!Array.isArray(importedWorks)) throw new Error("Invalid format");

          if (!confirm(`${importedWorks.length}件の作品データで現在のWSVを上書きしますか？`)) return;

          const seenNos = new Set();
          works = importedWorks.map((w, index) => {
            const statuses = normalizeStatuses(w);
            const dims = normalizeDimensions(w);
            let workNo = normalizeWorkNo(w.workNo || w.no || w.number);
            if (!workNo || seenNos.has(workNo)) {
              let candidate;
              do {
                candidate = String(index + seenNos.size).padStart(4, "0").slice(-4);
              } while (seenNos.has(candidate));
              workNo = candidate;
            }
            seenNos.add(workNo);

            return {
              id: w.id || createId(),
              workNo,
              title: String(w.title || "Untitled"),
              completedDate: String(w.completedDate || ""),
              series: String(w.series || ""),
              year: normalizeProductionDate(w),
              productionStatus: statuses.productionStatus,
              managementStatus: statuses.managementStatus,
              technique: String(w.technique || w.category || w.workCategory || ""),
              materials: String(w.materials || ""),
              sizeW: dims.w,
              sizeH: dims.h,
              sizeD: dims.d,
              price: String(w.price || "").toUpperCase() === "ASK" ? "" : (w.price === "" || w.price == null ? "" : Math.max(0, Math.round(Number(w.price) || 0))),
              priceAsk: Boolean(w.priceAsk) || String(w.price || "").toUpperCase() === "ASK",
              cost: w.cost === "" || w.cost == null ? "" : Math.max(0, Math.round(Number(w.cost) || 0)),
              location: String(w.location || ""),
              owner: String(w.owner || ""),
              exhibitionHistory: normalizeExhibitions(w.exhibitionHistory).join("\n"),
              memo: String(w.memo || ""),
              createdAt: w.createdAt || nowIso(),
              updatedAt: w.updatedAt || nowIso()
            };
          });

          const usedAfterWorks = new Set(works.map(w => normalizeWorkNo(w.workNo)).filter(Boolean));
          seriesRecords = importedSeriesRecords.map((s, index) => {
            let seriesNo = normalizeWorkNo(s.seriesNo || s.no || s.number);
            if (!seriesNo || usedAfterWorks.has(seriesNo)) {
              let candidate;
              do {
                candidate = String(9000 + index).padStart(4, "0").slice(-4);
              } while (usedAfterWorks.has(candidate));
              seriesNo = candidate;
            }
            usedAfterWorks.add(seriesNo);
            return {
              id: s.id || createId(),
              seriesNo,
              title: String(s.title || "Untitled Series"),
              startDate: String(s.startDate || ""),
              description: String(s.description || ""),
              createdAt: s.createdAt || nowIso(),
              updatedAt: s.updatedAt || nowIso()
            };
          });

          categories = cleanOptions([...(data.categories || categories), ...works.map(w => w.category)], DEFAULT_CATEGORIES);
          techniques = cleanOptions([...(data.techniques || techniques), ...works.map(w => w.technique)], DEFAULT_TECHNIQUES);
          locations = cleanOptions([...(data.locations || locations), ...works.map(w => w.location)], DEFAULT_LOCATIONS);
          seriesOptions = cleanOptions([...(data.seriesOptions || data.series || seriesOptions), ...works.map(w => w.series)], DEFAULT_SERIES);
          exhibitionOptions = cleanOptions([...(data.exhibitionOptions || data.exhibitions || exhibitionOptions), ...works.flatMap(w => normalizeExhibitions(w.exhibitionHistory))], DEFAULT_EXHIBITIONS);

          saveSettings();
          save();
          saveSeriesRecords();
          setupOptions();
          resetForm();
          render();
          showScreen("works");
          alert("インポートが完了しました。");
        } catch {
          alert("JSONファイルを読み込めませんでした。");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    });
