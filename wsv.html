<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>(VAMRSS) WSV Minimal Text</title>
  <style>
    :root {
      --bg: #f8f9f9;
      --ink: #111714;
      --sub: #68736f;
      --muted: #9aa5a1;
      --deep: #071c16;
      --danger: #9b3144;
      --font-main: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      -webkit-text-size-adjust: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--font-main);
      font-size: 11px;
      font-weight: 300;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 0 max(36px, env(safe-area-inset-bottom));
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 18px;
      margin-bottom: 15px;
    }

    .site-title {
      margin: 0;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.11em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .text-nav {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      color: var(--sub);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .text-button {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 0;
      color: var(--sub);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .text-button:hover,
    .text-button.active {
      color: var(--ink);
    }

    .text-button.danger {
      color: var(--danger);
    }

    .filter-area {
      display: grid;
      gap: 8px;
      margin-bottom: 11px;
    }

    .filter-line {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 11px;
      align-items: baseline;
    }

    .filter-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .link-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0 11px;
      min-width: 0;
    }

    .link-list .text-button {
      line-height: 1.45;
    }

    .collapsible {
      display: none;
      margin-top: 7px;
    }

    .collapsible.open {
      display: grid;
      gap: 7px;
    }

    .search-line {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      margin-bottom: 14px;
    }

    input, textarea, select {
      width: 100%;
      min-width: 0;
      min-height: 24px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      padding: 2px 0;
      outline: none;
      font-weight: 300;
    }

    textarea {
      min-height: 58px;
      resize: vertical;
      line-height: 1.45;
    }

    select {
      appearance: none;
    }

    input:focus, textarea:focus, select:focus {
      outline: 0;
    }

    .section-title {
      margin: 16px 0 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .list {
      display: grid;
      gap: 0;
    }

    .work {
      margin: 0;
    }

    .work-summary {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 86px;
      gap: 14px;
      align-items: baseline;
      border: 0;
      background: transparent;
      padding: 2px 0;
      text-align: left;
    }

    .work-summary.has-category {
      grid-template-columns: minmax(0, 1fr) 118px 86px;
    }

    .work-title {
      min-width: 0;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .work-category,
    .work-date {
      color: var(--sub);
      font-size: 11px;
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .work-detail {
      display: none;
      padding: 2px 0 9px 14px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 300;
      line-height: 1.45;
    }

    .work.open .work-detail {
      display: block;
    }

    .detail-grid {
      display: grid;
      gap: 1px;
      padding: 3px 0 6px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 10px;
      align-items: baseline;
    }

    .detail-key {
      color: var(--muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail-value {
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .detail-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .empty {
      padding: 14px 0;
      color: var(--sub);
      text-align: left;
    }

    .form {
      display: grid;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      gap: 10px 20px;
    }

    .field {
      display: grid;
      gap: 1px;
    }

    label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }

    .two-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .ask-line {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 20px;
      margin-top: 1px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .ask-line input {
      width: 12px;
      min-height: 12px;
      padding: 0;
      accent-color: var(--deep);
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 5px;
      margin-top: 3px;
    }

    .data-block {
      display: grid;
      gap: 7px;
      padding: 8px 0;
    }

    .hint {
      margin: 0;
      color: var(--sub);
      font-size: 11px;
      line-height: 1.45;
    }

    .option-list {
      display: grid;
      gap: 1px;
      margin-top: 2px;
    }

    .option-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 1px 0;
      color: var(--ink);
    }

    .font-sampler {
      margin-top: 28px;
      padding-top: 10px;
      color: var(--sub);
    }

    .font-sampler-title {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .font-list {
      display: grid;
      gap: 2px;
    }

    .font-option {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
      border: 0;
      background: transparent;
      padding: 1px 0;
      text-align: left;
      color: inherit;
      font-size: 11px;
      font-weight: 300;
      line-height: 1.45;
    }

    .font-option:hover {
      color: var(--ink);
    }

    .font-name {
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .font-preview {
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (min-width: 720px) {
      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .field.wide {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 719px) {
      .topbar {
        grid-template-columns: 1fr;
        gap: 7px;
      }

      .text-nav {
        justify-content: flex-start;
      }

      .filter-line,
      .search-line {
        grid-template-columns: 1fr;
        gap: 3px;
      }

      .work-summary,
      .work-summary.has-category {
        grid-template-columns: minmax(0, 1fr) 78px;
      }

      .work-category {
        display: none;
      }

      .detail-row {
        grid-template-columns: 76px minmax(0, 1fr);
      }

      .two-grid {
        grid-template-columns: 1fr;
      }

      .font-option {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="worksScreen" class="screen active">
      <div class="topbar">
        <h1 class="site-title">＊ (VAMRSS) WSV</h1>
        <nav class="text-nav">
          <button class="text-button" type="button" onclick="showScreen('entry')">ENTRY</button>
          <button class="text-button" type="button" onclick="showScreen('data')">DATA</button>
        </nav>
      </div>

      <div class="filter-area">
        <div class="filter-line">
          <div class="filter-label">Category</div>
          <div class="link-list" id="categoryLinks"></div>
        </div>

        <div class="filter-line">
          <button class="text-button" type="button" onclick="toggleStatusPanel()">状態</button>
          <div>
            <button class="text-button" type="button" onclick="toggleStatusPanel()" id="statusPanelText">tap to open</button>
            <div class="collapsible" id="statusPanel">
              <div class="filter-line" style="border-bottom:0; padding-bottom:0;">
                <div class="filter-label">Production</div>
                <div class="link-list" id="productionLinks"></div>
              </div>
              <div class="filter-line" style="border-bottom:0; padding-bottom:0;">
                <div class="filter-label">Management</div>
                <div class="link-list" id="managementLinks"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="search-line">
        <div class="filter-label">Search</div>
        <input id="searchInput" type="search" placeholder="">
        <button class="text-button" type="button" onclick="clearFilters()">CLEAR</button>
      </div>

      <div class="section-title">一覧</div>
      <div id="workList" class="list"></div>
    </section>

    <section id="entryScreen" class="screen">
      <div class="topbar">
        <h1 class="site-title">＊ (VAMRSS) WSV / ENTRY</h1>
        <nav class="text-nav">
          <button class="text-button" type="button" onclick="showScreen('works')">BACK</button>
          <button class="text-button" type="button" onclick="showScreen('data')">DATA</button>
        </nav>
      </div>

      <form id="workForm" class="form">
        <div class="form-grid">
          <div class="field wide">
            <label for="title">Title / 作品名</label>
            <input id="title" type="text" required placeholder="">
          </div>

          <div class="field">
            <label for="completedDate">Completed / 完成日</label>
            <input id="completedDate" type="date" placeholder="">
          </div>

          <div class="field">
            <label for="category">Category / 作品カテゴリ</label>
            <select id="category"></select>
          </div>

          <div class="field">
            <label for="series">Series / シリーズ</label>
            <input id="series" type="text" placeholder="">
          </div>

          <div class="field">
            <label for="year">Year / 制作年</label>
            <input id="year" type="number" inputmode="numeric" placeholder="">
          </div>

          <div class="field">
            <label for="productionStatus">Production / 制作状態</label>
            <select id="productionStatus"></select>
          </div>

          <div class="field">
            <label for="managementStatus">Management / 管理状態</label>
            <select id="managementStatus"></select>
          </div>

          <div class="field">
            <label for="technique">Technique / 技法</label>
            <select id="technique"></select>
          </div>

          <div class="field wide">
            <label for="materials">Materials / 素材</label>
            <input id="materials" type="text" placeholder="">
          </div>

          <div class="field wide">
            <label>Dimensions / サイズ mm</label>
            <div class="three-grid">
              <input id="sizeW" type="number" inputmode="numeric" min="0" placeholder="">
              <input id="sizeH" type="number" inputmode="numeric" min="0" placeholder="">
              <input id="sizeD" type="number" inputmode="numeric" min="0" placeholder="">
            </div>
          </div>

          <div class="field wide">
            <label>Ledger / 価格記録</label>
            <div class="two-grid">
              <div>
                <input id="price" type="number" inputmode="numeric" min="0" placeholder="">
                <label class="ask-line" for="priceAsk"><input id="priceAsk" type="checkbox"> ASK</label>
              </div>
              <input id="cost" type="number" inputmode="numeric" min="0" placeholder="">
            </div>
          </div>

          <div class="field">
            <label for="location">Location / 保管場所</label>
            <select id="location"></select>
          </div>

          <div class="field">
            <label for="owner">Owner / 所蔵先</label>
            <input id="owner" type="text" placeholder="">
          </div>

          <div class="field wide">
            <label for="exhibitionHistory">Exhibition History / 展示履歴</label>
            <textarea id="exhibitionHistory" placeholder=""></textarea>
          </div>

          <div class="field wide">
            <label for="memo">Memo / メモ</label>
            <textarea id="memo" placeholder=""></textarea>
          </div>
        </div>

        <div class="button-row">
          <button class="text-button active" type="submit" id="submitButton">SAVE</button>
          <button class="text-button" type="button" id="cancelButton" style="display:none;">CANCEL</button>
        </div>
      </form>
    </section>

    <section id="dataScreen" class="screen">
      <div class="topbar">
        <h1 class="site-title">＊ (VAMRSS) WSV / DATA</h1>
        <nav class="text-nav">
          <button class="text-button" type="button" onclick="showScreen('works')">BACK</button>
          <button class="text-button" type="button" onclick="showScreen('entry')">ENTRY</button>
        </nav>
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Export</div>
        <p class="hint">現在の作品データをJSONで保存します。</p>
        <button class="text-button active" type="button" id="exportButton">EXPORT</button>
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Import</div>
        <p class="hint">JSONを読み込みます。現在のデータは上書きされます。</p>
        <input id="importFile" type="file" accept="application/json,.json">
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Category</div>
        <div class="search-line" style="border-bottom:0; margin-bottom:0; padding-bottom:0;">
          <div class="filter-label">Add</div>
          <input id="categoryOptionInput" type="text" placeholder="">
          <button class="text-button" type="button" id="addCategoryButton">ADD</button>
        </div>
        <div id="categoryOptionList" class="option-list"></div>
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Technique</div>
        <div class="search-line" style="border-bottom:0; margin-bottom:0; padding-bottom:0;">
          <div class="filter-label">Add</div>
          <input id="techniqueOptionInput" type="text" placeholder="">
          <button class="text-button" type="button" id="addTechniqueButton">ADD</button>
        </div>
        <div id="techniqueOptionList" class="option-list"></div>
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Location</div>
        <div class="search-line" style="border-bottom:0; margin-bottom:0; padding-bottom:0;">
          <div class="filter-label">Add</div>
          <input id="locationOptionInput" type="text" placeholder="">
          <button class="text-button" type="button" id="addLocationButton">ADD</button>
        </div>
        <div id="locationOptionList" class="option-list"></div>
      </div>

      <div class="data-block">
        <div class="section-title" style="margin:0;">Reset</div>
        <p class="hint">ブラウザ内のWSVデータを削除します。必要な場合は先にEXPORTしてください。</p>
        <button class="text-button danger" type="button" id="resetButton">DELETE ALL</button>
      </div>
    </section>

      <div class="font-sampler">
        <p class="font-sampler-title">Font sampler</p>
        <div class="font-list" id="fontList"></div>
      </div>
  </main>

    const yen = new Intl.NumberFormat("ja-JP", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });

    let works = [];
    let categories = [];
    let techniques = [];
    let locations = [];
    let editingId = null;
    let activeCategory = "ALL";
    let activeProduction = "ALL";
    let activeManagement = "ALL";

    const form = document.getElementById("workForm");
    const workList = document.getElementById("workList");
    const searchInput = document.getElementById("searchInput");

    const fields = {
      title: document.getElementById("title"),
      completedDate: document.getElementById("completedDate"),
      category: document.getElementById("category"),

    function createId() {
      return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
    }

    function nowIso() { return new Date().toISOString(); }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(text) {
      return escapeHtml(text).replaceAll("`", "&#096;");
    }

    function cleanOptions(items, fallback) {
      const source = Array.isArray(items) && items.length ? items : fallback;
      return [...new Set(source.map(item => String(item || "").trim()).filter(Boolean))];
    }

    function sampleToWork(row, index) {
      return {
        id: "sample-" + String(index + 1).padStart(3, "0"),
        title: row[0],
        completedDate: row[1],
        category: row[2],
        series: row[3],
        year: row[4],
        productionStatus: row[5],
        managementStatus: row[6],
        technique: row[7],
        materials: row[8],
        sizeW: row[9] ? String(row[9]) : "",
        sizeH: row[10] ? String(row[10]) : "",
        sizeD: row[11] ? String(row[11]) : "",
        price: row[12] === "" ? "" : row[12],
        priceAsk: Boolean(row[13]),
        cost: row[14] === "" ? "" : row[14],
        location: row[15],
        owner: row[16],
        exhibitionHistory: row[17],
        memo: row[18],
        createdAt: nowIso(),
        updatedAt: nowIso()
      };
    }

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        works = Array.isArray(saved) ? saved : [];
      } catch {
        works = [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
    }

    function loadSettings() {
      try { categories = cleanOptions(JSON.parse(localStorage.getItem(CATEGORY_STORAGE_KEY)), DEFAULT_CATEGORIES); }
      catch { categories = [...DEFAULT_CATEGORIES]; }

      try { techniques = cleanOptions(JSON.parse(localStorage.getItem(TECHNIQUE_STORAGE_KEY)), DEFAULT_TECHNIQUES); }
      catch { techniques = [...DEFAULT_TECHNIQUES]; }

      try { locations = cleanOptions(JSON.parse(localStorage.getItem(LOCATION_STORAGE_KEY)), DEFAULT_LOCATIONS); }
      catch { locations = [...DEFAULT_LOCATIONS]; }
    }

    function saveSettings() {
      localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(categories));
      localStorage.setItem(TECHNIQUE_STORAGE_KEY, JSON.stringify(techniques));
      localStorage.setItem(LOCATION_STORAGE_KEY, JSON.stringify(locations));
    }

    function seedIfEmpty() {
      if (works.length) return;
      works = SAMPLE_WORKS.map(sampleToWork);
      categories = cleanOptions([...categories, ...works.map(w => w.category)], DEFAULT_CATEGORIES);
      techniques = cleanOptions([...techniques, ...works.map(w => w.technique)], DEFAULT_TECHNIQUES);
      locations = cleanOptions([...locations, ...works.map(w => w.location)], DEFAULT_LOCATIONS);
      saveSettings();
      save();
    }

    function renderCatalogSelect(select, items, selected = "") {
      const options = [...items];
      if (selected && !options.includes(selected)) options.unshift(selected);
      select.innerHTML = options.map(item => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
      if (selected) select.value = selected;
    }

    function setupOptions() {
      fields.productionStatus.innerHTML = PRODUCTION_STATUSES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      fields.managementStatus.innerHTML = MANAGEMENT_STATUSES.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("");
      renderCatalogSelect(fields.category, categories);
      renderCatalogSelect(fields.technique, techniques);
      renderCatalogSelect(fields.location, locations);
      renderOptionLists();
      renderFilters();
    }

    function renderFilters() {
      document.getElementById("categoryLinks").innerHTML = ["ALL", ...categories].map(item => {
        return `<button class="text-button ${item === activeCategory ? "active" : ""}" type="button" onclick="setCategory('${escapeAttr(item)}')">${escapeHtml(item)}</button>`;
      }).join("");

      document.getElementById("productionLinks").innerHTML = ["ALL", ...PRODUCTION_STATUSES].map(item => {
        return `<button class="text-button ${item === activeProduction ? "active" : ""}" type="button" onclick="setProduction('${escapeAttr(item)}')">${escapeHtml(item)}</button>`;
      }).join("");

      document.getElementById("managementLinks").innerHTML = ["ALL", ...MANAGEMENT_STATUSES].map(item => {
        return `<button class="text-button ${item === activeManagement ? "active" : ""}" type="button" onclick="setManagement('${escapeAttr(item)}')">${escapeHtml(item)}</button>`;
      }).join("");
    }

    function renderOptionLists() {
      renderOptionList("category", categories);
      renderOptionList("technique", techniques);
      renderOptionList("location", locations);
    }

    function renderOptionList(kind, items) {
      const target = document.getElementById(kind + "OptionList");
      target.innerHTML = items.map(item => `
        <div class="option-item">
          <div>${escapeHtml(item)}</div>
          <button class="text-button danger" type="button" onclick="deleteOption('${kind}', '${escapeAttr(item)}')">DELETE</button>
        </div>
      `).join("");
    }

    function addOption(kind) {
      const input = document.getElementById(kind + "OptionInput");
      const value = input.value.trim();
      if (!value) return;

      if (kind === "category" && !categories.includes(value)) categories.push(value);
      if (kind === "technique" && !techniques.includes(value)) techniques.push(value);
      if (kind === "location" && !locations.includes(value)) locations.push(value);

      input.value = "";
      saveSettings();
      setupOptions();
      resetForm();
      render();
    }

    window.deleteOption = function(kind, value) {
      if (kind === "category") categories = categories.filter(item => item !== value);
      if (kind === "technique") techniques = techniques.filter(item => item !== value);
      if (kind === "location") locations = locations.filter(item => item !== value);
      saveSettings();
      setupOptions();
      resetForm();
      render();
    };

    window.setCategory = function(value) {
      activeCategory = value;
      render();
    };

    window.setProduction = function(value) {
      activeProduction = value;
      render();
    };

    window.setManagement = function(value) {
      activeManagement = value;
      render();
    };

    window.clearFilters = function() {
      activeCategory = "ALL";
      activeProduction = "ALL";
      activeManagement = "ALL";
      searchInput.value = "";
      render();
    };

    window.toggleStatusPanel = function() {
      const panel = document.getElementById("statusPanel");
      const text = document.getElementById("statusPanelText");
      panel.classList.toggle("open");
      text.textContent = panel.classList.contains("open") ? "tap to close" : "tap to open";
    };

    window.showScreen = function(name) {
      ["works", "entry", "data"].forEach(id => {
        document.getElementById(id + "Screen").classList.toggle("active", id === name);
      });
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    function normalizeStatuses(w = {}) {
      const legacy = LEGACY_STATUS_MAP[w.status] || {};
      return {
        productionStatus: PRODUCTION_STATUSES.includes(w.productionStatus) ? w.productionStatus : legacy.productionStatus || "制作中",
        managementStatus: MANAGEMENT_STATUSES.includes(w.managementStatus) ? w.managementStatus : legacy.managementStatus || "保管中"
      };
    }

    function normalizeDimensions(w = {}) {
      if (w.sizeW || w.sizeH || w.sizeD) {
        return {
          w: String(w.sizeW || ""),
          h: String(w.sizeH || ""),
          d: String(w.sizeD || "")
        };
      }
      const size = String(w.size || "");
      const match = size.match(/W?\s*(\d+)\D+H?\s*(\d+)\D+D?\s*(\d+)/i);
      return {
        w: match ? match[1] : "",
        h: match ? match[2] : "",
        d: match ? match[3] : ""
      };
    }

    function formatDimensions(w = {}) {
      const d = normalizeDimensions(w);
      const parts = [];
      if (d.w) parts.push(`W${d.w}`);
      if (d.h) parts.push(`H${d.h}`);
      if (d.d) parts.push(`D${d.d}`);
      return parts.length ? `${parts.join(" × ")} mm` : "";
    }

    function formatMoney(value) {
      return value === "" || value == null ? "" : yen.format(Number(value) || 0);
    }

    function resetForm() {
      editingId = null;
      form.reset();
      renderCatalogSelect(fields.category, categories);
      renderCatalogSelect(fields.technique, techniques);
      renderCatalogSelect(fields.location, locations);
      fields.category.value = categories[0] || "";
      fields.technique.value = techniques[0] || "";
      fields.location.value = locations[0] || "";
      fields.productionStatus.value = "制作中";
      fields.managementStatus.value = "保管中";
      fields.priceAsk.checked = false;
      fields.price.disabled = false;
      document.getElementById("submitButton").textContent = "SAVE";
      document.getElementById("cancelButton").style.display = "none";
    }

    function formToWork(existing = {}) {
      const price = fields.price.value === "" ? "" : Math.max(0, Math.round(Number(fields.price.value) || 0));
      const cost = fields.cost.value === "" ? "" : Math.max(0, Math.round(Number(fields.cost.value) || 0));

      return {
        ...existing,
        id: existing.id || createId(),
        title: fields.title.value.trim(),
        completedDate: fields.completedDate.value,
        category: fields.category.value,
        series: fields.series.value.trim(),
        year: fields.year.value.trim(),
        productionStatus: fields.productionStatus.value,
        managementStatus: fields.managementStatus.value,
        technique: fields.technique.value,
        materials: fields.materials.value.trim(),
        sizeW: fields.sizeW.value.trim(),
        sizeH: fields.sizeH.value.trim(),
        sizeD: fields.sizeD.value.trim(),
        price,
        priceAsk: fields.priceAsk.checked,
        cost,
        location: fields.location.value,
        owner: fields.owner.value.trim(),
        exhibitionHistory: fields.exhibitionHistory.value.trim(),
        memo: fields.memo.value.trim(),
        createdAt: existing.createdAt || nowIso(),
        updatedAt: nowIso()
      };
    }

    function render() {
      renderFilters();

      const query = searchInput.value.trim().toLowerCase();

      const filtered = works
        .filter(w => activeCategory === "ALL" || String(w.category || "") === activeCategory)
        .filter(w => {
          const statuses = normalizeStatuses(w);
          return activeProduction === "ALL" || statuses.productionStatus === activeProduction;
        })
        .filter(w => {
          const statuses = normalizeStatuses(w);
          return activeManagement === "ALL" || statuses.managementStatus === activeManagement;
        })
        .filter(w => {
          if (!query) return true;
          const statuses = normalizeStatuses(w);
          return [
            w.title,
            w.completedDate,
            w.category,
            w.series,
            w.year,
            statuses.productionStatus,
            statuses.managementStatus,
            w.technique,
            w.materials,
            formatDimensions(w),
            w.priceAsk ? "ASK" : "",
            w.price,
            w.cost,
            w.location,
            w.owner,
            w.exhibitionHistory,
            w.memo
          ].some(value => String(value || "").toLowerCase().includes(query));
        })
        .sort((a, b) => {
          const dateCompare = String(b.completedDate || "").localeCompare(String(a.completedDate || ""));
          if (dateCompare) return dateCompare;
          return String(b.updatedAt || "").localeCompare(String(a.updatedAt || ""));
        });

      if (!filtered.length) {
        workList.innerHTML = '<div class="empty">該当する作品がありません。</div>';
        return;
      }

      workList.innerHTML = filtered.map(w => {
        const statuses = normalizeStatuses(w);
        const priceText = w.priceAsk ? "ASK" : formatMoney(w.price);
        const costText = formatMoney(w.cost);
        return `
          <article class="work" id="work-${escapeAttr(w.id)}">
            <button class="work-summary has-category" type="button" onclick="toggleWork('${escapeAttr(w.id)}')">
              <div class="work-title">${escapeHtml(w.title || "Untitled")}</div>
              <div class="work-category">${escapeHtml(w.category || "")}</div>
              <div class="work-date">${escapeHtml(w.completedDate || "")}</div>
            </button>
            <div class="work-detail">
              <div class="detail-grid">
                <div class="detail-row"><div class="detail-key">Category</div><div class="detail-value">${escapeHtml(w.category || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Series</div><div class="detail-value">${escapeHtml(w.series || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Year</div><div class="detail-value">${escapeHtml(w.year || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Production</div><div class="detail-value">${escapeHtml(statuses.productionStatus)}</div></div>
                <div class="detail-row"><div class="detail-key">Management</div><div class="detail-value">${escapeHtml(statuses.managementStatus)}</div></div>
                <div class="detail-row"><div class="detail-key">Technique</div><div class="detail-value">${escapeHtml(w.technique || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Materials</div><div class="detail-value">${escapeHtml(w.materials || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Size</div><div class="detail-value">${escapeHtml(formatDimensions(w))}</div></div>
                <div class="detail-row"><div class="detail-key">Price</div><div class="detail-value">${escapeHtml(priceText)}</div></div>
                <div class="detail-row"><div class="detail-key">Cost</div><div class="detail-value">${escapeHtml(costText)}</div></div>
                <div class="detail-row"><div class="detail-key">Location</div><div class="detail-value">${escapeHtml(w.location || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Owner</div><div class="detail-value">${escapeHtml(w.owner || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Exhibition</div><div class="detail-value">${escapeHtml(w.exhibitionHistory || "")}</div></div>
                <div class="detail-row"><div class="detail-key">Memo</div><div class="detail-value">${escapeHtml(w.memo || "")}</div></div>
              </div>
              <div class="detail-actions">
                <button class="text-button" type="button" onclick="startEdit('${escapeAttr(w.id)}')">EDIT</button>
                <button class="text-button danger" type="button" onclick="deleteWork('${escapeAttr(w.id)}')">DELETE</button>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    window.toggleWork = function(id) {
      const target = document.getElementById("work-" + id);
      if (target) target.classList.toggle("open");
    };

    window.startEdit = function(id) {
      const w = works.find(item => item.id === id);
      if (!w) return;

      editingId = id;
      fields.title.value = w.title || "";
      fields.completedDate.value = w.completedDate || "";
      renderCatalogSelect(fields.category, categories, w.category || "");
      fields.series.value = w.series || "";
      fields.year.value = w.year || "";

      const statuses = normalizeStatuses(w);
      fields.productionStatus.value = statuses.productionStatus;
      fields.managementStatus.value = statuses.managementStatus;

      renderCatalogSelect(fields.technique, techniques, w.technique || "");
      fields.materials.value = w.materials || "";

      const dims = normalizeDimensions(w);
      fields.sizeW.value = dims.w;
      fields.sizeH.value = dims.h;
      fields.sizeD.value = dims.d;

      fields.priceAsk.checked = Boolean(w.priceAsk) || String(w.price || "").toUpperCase() === "ASK";
      fields.price.value = fields.priceAsk.checked ? "" : (w.price || "");
      fields.price.disabled = fields.priceAsk.checked;
      fields.cost.value = w.cost || "";

      renderCatalogSelect(fields.location, locations, w.location || "");
      fields.owner.value = w.owner || "";
      fields.exhibitionHistory.value = w.exhibitionHistory || "";
      fields.memo.value = w.memo || "";

      document.getElementById("submitButton").textContent = "UPDATE";
      document.getElementById("cancelButton").style.display = "inline-block";
      showScreen("entry");
    };

    window.deleteWork = function(id) {
      if (!confirm("この作品を削除しますか？")) return;
      works = works.filter(w => w.id !== id);
      save();
      if (editingId === id) resetForm();
      render();
    };

    fields.priceAsk.addEventListener("change", () => {
      fields.price.disabled = fields.priceAsk.checked;
      if (fields.priceAsk.checked) fields.price.value = "";
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (!fields.title.value.trim()) {
        alert("作品名を入力してください。");
        return;
      }

      if (editingId) {
        works = works.map(w => w.id === editingId ? formToWork(w) : w);
      } else {
        works.push(formToWork());
      }

      save();
      resetForm();
      render();
      showScreen("works");
    });

    document.getElementById("cancelButton").addEventListener("click", () => {
      resetForm();
      showScreen("works");
    });

    searchInput.addEventListener("input", render);

    document.getElementById("addCategoryButton").addEventListener("click", () => addOption("category"));
    document.getElementById("addTechniqueButton").addEventListener("click", () => addOption("technique"));
    document.getElementById("addLocationButton").addEventListener("click", () => addOption("location"));

    ["category", "technique", "location"].forEach(kind => {
      document.getElementById(kind + "OptionInput").addEventListener("keydown", event => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        addOption(kind);
      });
    });

    document.getElementById("exportButton").addEventListener("click", () => {
      const backup = {
        app: "(VAMRSS) WORKSHEET VAULT SYSTEM",
        abbreviation: "WSV",
        version: "minimal-text-1.0",
        exportedAt: nowIso(),
        works,
        categories,
        techniques,
        locations
      };

      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const filename = `WSV-${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;

      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const importedWorks = Array.isArray(data) ? data : data.works;
          if (!Array.isArray(importedWorks)) throw new Error("Invalid format");

          if (!confirm(`${importedWorks.length}件の作品データで現在のWSVを上書きしますか？`)) return;

          works = importedWorks.map(w => {
            const statuses = normalizeStatuses(w);
            const dims = normalizeDimensions(w);
            return {
              id: w.id || createId(),
              title: String(w.title || "Untitled"),
              completedDate: String(w.completedDate || ""),
              category: String(w.category || w.workCategory || "OTHER"),
              series: String(w.series || ""),
              year: String(w.year || ""),
              productionStatus: statuses.productionStatus,
              managementStatus: statuses.managementStatus,
              technique: String(w.technique || ""),
              materials: String(w.materials || ""),
              sizeW: dims.w,
              sizeH: dims.h,
              sizeD: dims.d,
              price: String(w.price || "").toUpperCase() === "ASK" ? "" : (w.price === "" || w.price == null ? "" : Math.max(0, Math.round(Number(w.price) || 0))),
              priceAsk: Boolean(w.priceAsk) || String(w.price || "").toUpperCase() === "ASK",
              cost: w.cost === "" || w.cost == null ? "" : Math.max(0, Math.round(Number(w.cost) || 0)),
              location: String(w.location || ""),
              owner: String(w.owner || ""),
              exhibitionHistory: String(w.exhibitionHistory || ""),
              memo: String(w.memo || ""),
              createdAt: w.createdAt || nowIso(),
              updatedAt: w.updatedAt || nowIso()
            };
          });

          categories = cleanOptions([...(data.categories || categories), ...works.map(w => w.category)], DEFAULT_CATEGORIES);
          techniques = cleanOptions([...(data.techniques || techniques), ...works.map(w => w.technique)], DEFAULT_TECHNIQUES);
          locations = cleanOptions([...(data.locations || locations), ...works.map(w => w.location)], DEFAULT_LOCATIONS);

          saveSettings();
          save();
          setupOptions();
          resetForm();
          render();
          showScreen("works");
          alert("インポートが完了しました。");
        } catch {
          alert("JSONファイルを読み込めませんでした。");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("resetButton").addEventListener("click", () => {
      if (!confirm("すべての作品データを削除しますか？")) return;
      if (!confirm("本当に削除しますか？この操作は元に戻せません。")) return;
      works = [];
      save();
      resetForm();
      render();
      showScreen("works");
    });

    load();
    loadSettings();
    seedIfEmpty();
    setupOptions();
    resetForm();
    render();
    renderFontSampler();
  </script>
</body>
</html>
